# Pre-commit hooks — Phase 5 of docs/todo.md.
# Install once with:  pre-commit install
# Run against everything with:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/
        exclude: ^frontend/(package-lock\.json|node_modules/|\.next/)

  - repo: local
    hooks:
      - id: backend-tests
        name: backend tests (pytest)
        entry: bash -c 'cd backend && python -m pytest -q -x'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-tests
        name: frontend tests (vitest)
        entry: bash -c 'cd frontend && npm test -- --run'
        language: system
        pass_filenames: false
        stages: [pre-push]
