[pytest]
DJANGO_SETTINGS_MODULE = core.settings
pythonpath = .
testpaths = apps core tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra            summarize non-passing tests with reasons
# --strict-markers / --strict-config  fail on unknown markers/options
# --cov          every run reports coverage; the floor is enforced in CI
# --cov-fail-under=60  local floor (catches a collapsed suite early); the
#                      strict 80% ratchet for orders/payments/inventory runs
#                      as a separate `coverage report --include=...` in CI
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=apps
    --cov=core
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=60

markers =
    slow: tests that take more than a second (deselect with `-m "not slow"`)
